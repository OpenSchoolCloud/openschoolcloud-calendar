# android/settings.gradle.kts wordt gevonden. APK-uitvoer wordt gezocht in
# <subdir>/build/outputs/apk/release = android/app/build/outputs/apk/release.
# Precedent: de.tutao.tutanota in fdroiddata (subdir: app-android/app).
